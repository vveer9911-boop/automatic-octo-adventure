name: Build Recover Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Recover Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 21 (Required by Capacitor 6 / Gradle 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build static web export (out/) for Capacitor
        run: npm run build:apk-web

      - name: Initialize & Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Recover App Icon & Dark Launch Theme
        run: |
          python3 -m pip install --quiet Pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          src = "public/brand/app-icon-1024.png"
          if os.path.exists(src):
              im = Image.open(src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_root = "android/app/src/main/res"
              for folder, px in sizes.items():
                  target_dir = os.path.join(res_root, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = im.resize((px, px), Image.Resampling.LANCZOS)
                  for fn in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      resized.save(os.path.join(target_dir, fn))
              # Remove adaptive xml overrides so Android uses our exact Recover icon PNGs cleanly
              anydpi = os.path.join(res_root, "mipmap-anydpi-v26")
              if os.path.exists(anydpi):
                  for fn in os.listdir(anydpi):
                      if fn.endswith(".xml"):
                          os.remove(os.path.join(anydpi, fn))
              print("Applied Recover launcher icons across all Android mipmap densities.")
          EOF

      - name: Build Debug & Signed Release APKs with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

          # Generate a release keystore and sign the release APK so it installs cleanly on any Android device
          keytool -genkeypair -v \
            -keystore recover-release.keystore \
            -alias recover_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass recover123 \
            -keypass recover123 \
            -dname "CN=Recover Wallet, OU=Mobile, O=Recover, L=City, S=State, C=US"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks recover-release.keystore \
            --ks-key-alias recover_key \
            --ks-pass pass:recover123 \
            --key-pass pass:recover123 \
            --out ../Recover-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          cp app/build/outputs/apk/debug/app-debug.apk ../Recover-debug.apk

      - name: Upload Recover Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recover-Android-APK
          path: |
            Recover-release-signed.apk
            Recover-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            Recover-release-signed.apk \
            Recover-debug.apk \
            --title "Recover Android APK v1.0.0" \
            --notes "Signed Android APK for Recover: Screen Time Wallet (app.recoverwallet.android). Install Recover-release-signed.apk directly on any Android device."

